[General]
network = opticaldatacenter.OpticalDataCenter

# הגדרות בסיסיות לכל הסימולציות
sim-time-limit = 5s
warmup-period = 1s

# פרמטרים קבועים לכל הסימולציות
*.numServers = 8

# פרמטרי שרת בסיסיים
*.server[*].serverId = index
*.server[*].numServers = 8
*.server[*].sendRate = 1Gbps
*.server[*].skewFactor = 0.8
*.server[*].useWebSearchWorkload = false

# פרמטרי מתג אופטי בסיסיים
*.opticalSwitch.numPorts = 8
*.opticalSwitch.reconfigurationDelay = 0.5us
*.opticalSwitch.timeslotDuration = 10us
*.opticalSwitch.k = 3

# רישום סטטיסטיקות - חשוב!
**.vector-recording = true
**.scalar-recording = true
**.bin-recording = true

# תיקיית תוצאות
output-vector-file = ${resultdir}/${configname}-${runnumber}.vec
output-scalar-file = ${resultdir}/${configname}-${runnumber}.sca

# הגדרות לוג
**.debug = false
cmdenv-express-mode = true
cmdenv-autoflush = true

#=============================================================================
# בדיקה 1: Vermilion + Uniform Traffic
#=============================================================================
[Config Vermilion_Uniform]
description = "Vermilion algorithm with uniform traffic pattern"

# אלגוריתם ודפוס תעבורה
*.opticalSwitch.schedulingAlgorithm = "vermilion"
*.server[*].trafficPattern = "uniform"

# רישום נתונים נוסף עבור Vermilion
*.opticalSwitch.**.vector-recording = true
*.opticalSwitch.**.scalar-recording = true

#=============================================================================
# בדיקה 2: Vermilion + Permutation Traffic  
#=============================================================================
[Config Vermilion_Permutation]
description = "Vermilion algorithm with permutation traffic pattern"

# אלגוריתם ודפוס תעבורה
*.opticalSwitch.schedulingAlgorithm = "vermilion"
*.server[*].trafficPattern = "permutation"

# רישום נתונים נוסף עבור Vermilion
*.opticalSwitch.**.vector-recording = true
*.opticalSwitch.**.scalar-recording = true

#=============================================================================
# בדיקה 3: Round-Robin + Uniform Traffic
#=============================================================================
[Config RoundRobin_Uniform]
description = "Round-robin algorithm with uniform traffic pattern"

# אלגוריתם ודפוס תעבורה
*.opticalSwitch.schedulingAlgorithm = "round-robin"
*.server[*].trafficPattern = "uniform"

# רישום נתונים נוסף עבור Round-Robin
*.opticalSwitch.**.vector-recording = true
*.opticalSwitch.**.scalar-recording = true

#=============================================================================
# בדיקה 4: Round-Robin + Permutation Traffic
#=============================================================================
[Config RoundRobin_Permutation]
description = "Round-robin algorithm with permutation traffic pattern"

# אלגוריתם ודפוס תעבורה
*.opticalSwitch.schedulingAlgorithm = "round-robin"
*.server[*].trafficPattern = "permutation"

# רישום נתונים נוסף עבור Round-Robin
*.opticalSwitch.**.vector-recording = true
*.opticalSwitch.**.scalar-recording = true
