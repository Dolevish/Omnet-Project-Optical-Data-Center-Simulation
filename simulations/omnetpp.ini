[General]
network = opticaldatacenter.OpticalDataCenter
sim-time-limit = 100ms
warmup-period = 10ms
repeat = 3
seed-set = ${repetition}
# One independent stream per source; paired configurations share workloads.
num-rngs = 64
*.server[*].rng-0 = index
*.numServers = 8
*.linkRate = 100Gbps
*.packetBytes = 1500
*.server[*].sendRate = 1Gbps
*.server[*].skewFactor = 0.8
*.server[*].useWebSearchWorkload = false
*.opticalSwitch.reconfigurationDelay = 0.5us
*.opticalSwitch.timeslotDuration = 10us
*.opticalSwitch.queueCapacity = 1000
*.opticalSwitch.k = 3
# Avoid large per-packet vector files unless explicitly requested.
**.vector-recording = false
output-vector-file = ${resultdir}/${configname}-${runnumber}.vec
output-scalar-file = ${resultdir}/${configname}-${runnumber}.sca
cmdenv-express-mode = true

[Config Vermilion_Uniform]
description = "Demand-aware scheduling, uniform destinations"
*.opticalSwitch.schedulingAlgorithm = "vermilion"
*.server[*].trafficPattern = "uniform"

[Config Vermilion_Permutation]
description = "Demand-aware scheduling, ring permutation"
*.opticalSwitch.schedulingAlgorithm = "vermilion"
*.server[*].trafficPattern = "permutation"

[Config RoundRobin_Uniform]
description = "Cyclic scheduling, uniform destinations"
*.opticalSwitch.schedulingAlgorithm = "round-robin"
*.server[*].trafficPattern = "uniform"

[Config RoundRobin_Permutation]
description = "Cyclic scheduling, ring permutation"
*.opticalSwitch.schedulingAlgorithm = "round-robin"
*.server[*].trafficPattern = "permutation"

[Config Vermilion_Skewed]
extends = Vermilion_Uniform
*.server[*].trafficPattern = "skewed"

[Config RoundRobin_Skewed]
extends = RoundRobin_Uniform
*.server[*].trafficPattern = "skewed"

[Config Vermilion_WebSearch]
extends = Vermilion_Uniform
*.server[*].trafficPattern = "websearch"
*.server[*].useWebSearchWorkload = true

[Config RoundRobin_WebSearch]
extends = RoundRobin_Uniform
*.server[*].trafficPattern = "websearch"
*.server[*].useWebSearchWorkload = true
